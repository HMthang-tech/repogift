<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #f3e8ff 50%, #e0f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(236, 72, 153, 0.1);
            text-align: center;
            width: 320px;
        }
        h2 { color: #1a202c; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #ec4899; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔐 Đăng Nhập</h2>
        <input type="text" id="username" placeholder="Tài khoản...">
        <input type="password" id="password" placeholder="Mật khẩu...">
        <button onclick="login()">Đăng Nhập</button>
        <p id="errorMsg" style="color: red; display: none; font-size: 14px;">Sai tài khoản hoặc mật khẩu!</p>
    </div>

    <script>
        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
           // Nếu đăng nhập đúng
if (user === 'admin' && pass === '123456') {
    // PHẢI LƯU LÀ adminTicket thì bên index mới đọc được
    sessionStorage.setItem('adminTicket', 'true');
    window.location.href = 'index.html'; 
}
        }
    </script>

</body>
</html>
